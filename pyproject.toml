[project]
name = "RNN-paper"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.10.8",
    "numpy>=2.4.4",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.1",
    "tqdm>=4.67.3",
    "sympy",
    "ipympl>=0.10.0",
    "h5py>=3.16.0",
]


[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"



[dependency-groups]
dev = [
    "ruff>=0.15.8",
]


[tool.ruff]
line-length = 79
format.skip-magic-trailing-comma = true
